name: CARI-7A dose grid

# Genera la rejilla de tasas de dosis con CARI-7A real (FAA CAMI) y la embebe
# en index.html. También refresca mensualmente el potencial heliocéntrico.
#
#  - workflow_dispatch (manual): selftest de fidelidad → rejilla (10 HP en
#    paralelo) → ensamblado/validación → embed → commit+push.
#  - schedule (día 1 de cada mes): solo refresca HP_MONTHS desde MV-DATES.L99.
#
# El binario Linux de CARI-7A se descarga de la página oficial de la FAA.
# S2 (suministro): el zip se verifica contra un SHA-256 conocido ANTES de
# descomprimir y de ejecutarlo. Si la FAA actualiza el zip, hay que renovar
# FAA_CARI7A_SHA256 (el pipeline falla cerrado con el mensaje claro de
# sha256sum). MV-DATES no lleva checksum: cambia cada mes por diseño, y
# update_hp_months.py solo extrae números con regex (no puede inyectar código)
# y descarta valores fuera de rango plausible antes de commitearlos a main.

on:
  workflow_dispatch:
    inputs:
      regenerate_grid:
        description: 'Regenerar la rejilla completa (10 niveles HP, ~20-40 min)'
        type: boolean
        default: true
      update_hp_only:
        description: 'Solo refrescar HP_MONTHS (rápido). Si se combina con regenerate_grid, el refresco se ejecuta DESPUÉS de commitear la rejilla (los jobs están serializados).'
        type: boolean
        default: false
  schedule:
    - cron: '23 3 1 * *'   # día 1 de cada mes, 03:23 UTC

# Mínimo privilegio (S2): solo los jobs que commitean a main piden write.
permissions:
  contents: read

concurrency:
  group: dose-grid
  cancel-in-progress: true

env:
  FAA_CARI7A_ZIP: https://www.faa.gov/sites/faa.gov/files/data_research/research/med_humanfacs/aeromedical/cari_7Aexe.zip
  # SHA-256 del zip oficial de la FAA (verificado el 2026-08-24, 21.534.996 bytes).
  FAA_CARI7A_SHA256: accf41177a2082ca1c526a8c757df48972ce4411ef2329c6ce22a48edfe3f613
  FAA_MVDATES_ZIP: https://www.faa.gov/sites/faa.gov/files/data_research/research/med_humanfacs/aeromedical/MV-DATES.zip
  CARI_BIN: "cari7a_4.2.0(intel_linux)"

jobs:
  selftest:
    # Autocomprobación: la configuración batch debe reproducir la salida de
    # referencia oficial (Examples/EXAMPLES.LOC -> EXAMPLES.ANS, tol 5%).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pin S2)
      - name: Instalar runtime Fortran
        run: sudo apt-get update && sudo apt-get install -y libgfortran5
      - name: Descargar CARI-7A (FAA)
        run: curl -sfL -o cari7a.zip "$FAA_CARI7A_ZIP"
      - name: Verificar SHA-256 del zip CARI-7A (suministro)
        run: echo "$FAA_CARI7A_SHA256  cari7a.zip" | sha256sum -c -
      - name: Descomprimir CARI-7A (tras verificar el checksum)
        run: unzip -q cari7a.zip
      - name: Selftest de fidelidad
        run: python3 tools/cari7_generate.py --selftest-only --cari-dir CARI_7A_DVD --binary "$CARI_BIN"

  grid:
    needs: selftest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.regenerate_grid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        hp: [300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pin S2)
      - name: Instalar runtime Fortran
        run: sudo apt-get update && sudo apt-get install -y libgfortran5
      - name: Descargar CARI-7A (FAA)
        run: curl -sfL -o cari7a.zip "$FAA_CARI7A_ZIP"
      - name: Verificar SHA-256 del zip CARI-7A (suministro)
        run: echo "$FAA_CARI7A_SHA256  cari7a.zip" | sha256sum -c -
      - name: Descomprimir CARI-7A (tras verificar el checksum)
        run: unzip -q cari7a.zip
      - name: Generar + ejecutar CARI-7A (HP ${{ matrix.hp }} MV)
        run: python3 tools/cari7_generate.py --hp ${{ matrix.hp }} --cari-dir CARI_7A_DVD
             --cutoffs CARI_7A_DVD/CUTOFFS --binary "$CARI_BIN" --out rates_hp${{ matrix.hp }}.csv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pin S2)
        with:
          name: rates-hp-${{ matrix.hp }}
          path: rates_hp${{ matrix.hp }}.csv

  assemble:
    needs: grid
    if: always() && needs.grid.result == 'success' && !cancelled()
    # Único job que commitea el resultado del grid: necesita write a main.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # S5: sin persist-credentials el GITHUB_TOKEN no se guarda en .git/config;
      # este job descomprime y procesa ficheros de la FAA, y un checksum
      # verificado tarde no puede convertirse en push a main. El push de abajo
      # sigue funcionando (gh-actions bot / GITHUB_TOKEN por acción de git).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pin S2)
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 (pin S2)
        with:
          path: rates
      - name: Descargar CARI-7A (FAA)
        run: curl -sfL -o cari7a.zip "$FAA_CARI7A_ZIP"
      - name: Verificar SHA-256 del zip CARI-7A (suministro)
        run: echo "$FAA_CARI7A_SHA256  cari7a.zip" | sha256sum -c -
      - name: Descomprimir CARI-7A (tras verificar el checksum)
        run: unzip -q cari7a.zip
      - name: Fusionar CSVs
        run: |
          python3 - <<'PY'
          import csv, glob
          rows, header = [], None
          for p in sorted(glob.glob("rates/rates-hp-*/rates_hp*.csv")):
              with open(p) as f:
                  r = csv.reader(f)
                  h = next(r)
                  if header is None: header = h
                  assert h == header, (p, h, header)
                  rows.extend(list(r))
          with open("rates_all.csv", "w", newline="") as f:
              w = csv.writer(f)
              w.writerow(header)
              w.writerows(rows)
          print("total puntos:", len(rows))
          PY
      - name: Ensamblar rejilla + mapa de rigidez + embeber
        run: |
          python3 tools/generate_dose_grid.py --input rates_all.csv \
            --axes "0:18:0.25,8.0:13.0:0.5,300:1200:100" --out dose_grid.js
          python3 tools/generate_dose_grid.py --rc-map CARI_7A_DVD/CUTOFFS/IGRF2010.1X1 \
            --out rc_map.js
          python3 tools/embed_dose_grid.py --grid dose_grid.js --rc-map rc_map.js --index index.html
      - name: Sanity check de monotonicidad (rejilla embebida)
        run: |
          node -e '
          const fs=require("fs"),vm=require("vm");
          const html=fs.readFileSync("index.html","utf8");
          const m=html.match(/<script type="text\/javascript">([\s\S]*?)<\/script>/);
          const sb={React:{useState:()=>[null,()=>{}],useCallback:f=>f,useRef:()=>({current:null}),useEffect:()=>{},createElement:()=>({})},ReactDOM:{createRoot:()=>({render(){}})},document:{getElementById:()=>({})},atob:s=>Buffer.from(s,"base64").toString("binary"),console};
          vm.createContext(sb); vm.runInContext(m[1],sb,{filename:"app.js"});
          const ctx=sb;
          let malas = 0;
          const casos = [[50,270],[50,150],[0,80],[70,20],[-40,140]];
          for (const c of casos) {
            const la = c[0], lo = c[1];
            const bajo   = ctx.doseRateGrid(la, lo,  9.0,  650);
            const alto   = ctx.doseRateGrid(la, lo, 12.5,  650);
            const solMax = ctx.doseRateGrid(la, lo, 11.0, 1200);
            const solMin = ctx.doseRateGrid(la, lo, 11.0,  300);
            if (![bajo, alto, solMax, solMin].every(Number.isFinite)) {
              malas++; console.log("valor no finito en", la, lo); continue;
            }
            if (!(alto > bajo))   { malas++; console.log("la altitud no sube la dosis en", la, lo); }
            if (!(solMin > solMax)) { malas++; console.log("el sol no baja la dosis en", la, lo); }
          }
          if (!(ctx.doseRateGrid(50, 270, 11.0, 650) > ctx.doseRateGrid(50, 150, 11.0, 650))) {
            malas++; console.log("la rigidez no baja la dosis");
          }
          if (malas) { console.log("FALLO: " + malas + " comprobaciones de monotonicidad"); process.exit(1); }
          console.log("monotonicidad OK");
          '
      - name: Commit y push
        run: |
          git config user.name "cosmic-rad-bot"
          git config user.email "cosmic-rad-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "chore(dose): regenerate CARI-7A effective-dose grid (FAA CAMI)" && git push)

  hp-months:
    # Refresco mensual del potencial heliocéntrico (MV-DATES.L99 de la FAA).
    # needs: assemble — serializa la escritura de index.html. Si un dispatch
    # pide grid+hp a la vez, hp-months espera a que assemble haya commiteado la
    # rejilla; antes ambos jobs reescribían index.html en paralelo y uno pisaba
    # silenciosamente el cambio del otro (o el push chocaba). Con assemble
    # saltado (solo HP, o schedule) se ejecuta igualmente.
    needs: assemble
    # !cancelled() es la status-check function: sin ella, un needs saltado
    # propaga el skip y este job NI evalúa su if — el refresh mensual de
    # HP_MONTHS (schedule, assemble siempre saltado) moriría. El guard de
    # needs.assemble.result decide después: skipped/success → corre.
    if: |
      !cancelled() && (github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && github.event.inputs.update_hp_only == 'true'))
      && (needs.assemble.result == 'skipped' || needs.assemble.result == 'success')
    # Commitea el refresco de HP_MONTHS: necesita write a main.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # S5: este job descomprime MV-DATES (terceros, sin checksum) y commitea;
      # sin credenciales persistidas un RCE ahí no obtiene push a main gratis.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pin S2)
        with:
          persist-credentials: false
      - name: Descargar MV-DATES (FAA)
        run: curl -sfL -o mv.zip "$FAA_MVDATES_ZIP" && unzip -q mv.zip
      - name: Actualizar HP_MONTHS en index.html
        run: python3 tools/update_hp_months.py --mv-dates MV-DATES.L99 --index index.html --since 2011
      - name: Commit y push
        run: |
          git config user.name "cosmic-rad-bot"
          git config user.email "cosmic-rad-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "chore(dose): refresh monthly heliocentric potential (FAA MV-DATES)" && git push)
