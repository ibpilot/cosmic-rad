<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#080f18; font-family:-apple-system,'Inter','Helvetica Neue',sans-serif; }
input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:4px;
  border-radius:2px; background:rgba(255,255,255,0.12); outline:none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px;
  border-radius:50%; cursor:pointer; border:2px solid #fff; }
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:2px; }
table { border-collapse:collapse; width:100%; }
.ap-input { width:100%; background:rgba(255,255,255,0.07); border:1.5px solid rgba(255,255,255,0.15);
  border-radius:8px; color:#e0eef5; padding:8px 10px; font-size:14px; font-weight:700;
  outline:none; text-transform:uppercase; letter-spacing:1px; font-family:inherit; }
.ap-input::placeholder { text-transform:none; letter-spacing:0; font-weight:400; color:#3a5a70; font-size:12px; }
.ap-input.valid  { border-color:#3b9ede; background:rgba(59,158,222,0.08); }
.ap-input.error  { border-color:#e05050; background:rgba(224,80,80,0.08); }
.ap-input:focus  { border-color:#5aaeee; }
.dropdown { position:absolute; top:100%; left:0; right:0; z-index:100; margin-top:3px;
  background:#0d1e30; border:1px solid rgba(255,255,255,0.15); border-radius:9px;
  overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,0.5); }
.dropdown-item { padding:9px 12px; cursor:pointer; display:flex; align-items:center; gap:8px;
  border-bottom:1px solid rgba(255,255,255,0.05); transition:background 0.12s; }
.dropdown-item:last-child { border-bottom:none; }
.dropdown-item:hover, .dropdown-item.focused { background:rgba(59,158,222,0.15); }
.di-code { font-size:13px; font-weight:700; color:#3b9ede; min-width:38px; letter-spacing:0.5px; }
.di-name { font-size:11px; color:#a0c0d0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.di-icao { font-size:10px; color:#4a7a90; margin-left:auto; white-space:nowrap; padding-left:6px; }

/* Responsive grid helpers */
.grid-2col { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid-3col { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.flight-row-grid { display:grid; grid-template-columns:1fr 18px 1fr auto 32px; gap:6px; align-items:start; margin-bottom:6px; }
.ring-row { display:flex; gap:16px; align-items:center; }

/* Desktop enhancements */
@media (min-width:600px) {
  .app-inner { padding:20px 24px 0; }
  .modal-sheet { border-radius:16px !important; max-height:80vh; margin:auto; }
  .modal-wrap { align-items:center !important; padding:20px; }
}

/* Small phone adjustments */
@media (max-width:380px) {
  .grid-2col { grid-template-columns:1fr; }
  .grid-3col { grid-template-columns:1fr 1fr; }
  .flight-row-grid { grid-template-columns:1fr 14px 1fr auto 28px; gap:4px; }
  .di-icao { display:none; }
  .ring-row { flex-direction:column; align-items:flex-start; gap:10px; }
}
</style>
</head>

    // Info modal

    infoModalFooter: "Contenido basado en ICRP 103, EURADOS, UNSCEAR 2008 y literatura epidemiológica revisada por pares. No constituye asesoramiento médico.",
    infoSections: [{
      icon: "🌌",
      title: "¿Qué es la radiación cósmica?",
      body: "El universo est\xE1 permanentemente bombardeado por rayos c\xF3smicos: part\xEDculas subat\xF3micas de alta energ\xEDa (protones, n\xFAcleos de helio, electrones) que viajan a velocidades cercanas a la de la luz. Tienen origen tanto en el Sol como en fuentes extragal\xE1cticas \u2014supernovas, p\xFAlsares, n\xFAcleos activos de galaxias\u2014 y alcanzan la Tierra constantemente.\n\nA nivel del suelo, la atm\xF3sfera nos protege absorbiendo la mayor parte. Pero a 35.000 pies (FL350), solo queda una fracci\xF3n de esa protecci\xF3n: la dosis por radiaci\xF3n c\xF3smica es entre 100 y 300 veces mayor que en tierra."
    }, {
      icon: "⚡",
      title: "Radiación ionizante: ¿qué significa?",
      body: "Se llama ionizante a la radiaci\xF3n con suficiente energ\xEDa para arrancar electrones de los \xE1tomos, creando iones. Esto puede da\xF1ar el ADN celular directamente o generando radicales libres.\n\nExisten varios tipos: rayos gamma y X (electromagn\xE9tica), part\xEDculas alfa (n\xFAcleos de helio), beta (electrones), y neutrones. A bordo de un avi\xF3n se combinan principalmente fotones de alta energ\xEDa y muones \u2014part\xEDculas secundarias generadas cuando los rayos c\xF3smicos chocan con la atm\xF3sfera superior."
    }, {
      icon: "📏",
      title: "Unidades: Sievert y la escala completa",
      body: "El Sievert (Sv) mide la dosis absorbida ponderada por el da\xF1o biol\xF3gico que causa cada tipo de radiaci\xF3n en el tejido humano. Es la unidad oficial de protecci\xF3n radiol\xF3gica (ICRP).\n\nLa escala completa, de menor a mayor:\n\n\u2022 1 \xB5Sv (microsievert) = 0,000001 Sv\n  \u2014 Una Rx dental \u2248 5 \xB5Sv\n  \u2014 Un vuelo transatl\xE1ntico \u2248 30\u201380 \xB5Sv\n\n\u2022 1 mSv (millisievert) = 0,001 Sv\n  \u2014 Fondo natural anual en Espa\xF1a \u2248 2,4 mSv\n  \u2014 L\xEDmite recomendado tripulaci\xF3n a\xE9rea: 20 mSv/a\xF1o\n\n\u2022 1 Sv = dosis aguda que empieza a causar s\xEDntomas (n\xE1useas)\n\u2022 4\u20135 Sv = dosis letal al 50% sin tratamiento (LD50)\n\u2022 >10 Sv = dosis letal con casi total seguridad\n\nPara contexto: toda la carrera de un piloto de largo radio raramente supera los 200\u2013400 mSv acumulados, lejos del rango donde se observan efectos deterministas.\n\nTrabajadores de centrales nucleares:\n\nEl l\xEDmite regulatorio para trabajadores de instalaciones nucleares es el mismo que para tripulaci\xF3n a\xE9rea: 20 mSv/a\xF1o promediado en 5 a\xF1os, con un m\xE1ximo de 50 mSv en un solo a\xF1o (ICRP 103, Directiva Euratom 2013/59).\n\nSin embargo, la exposici\xF3n real media es muy inferior al l\xEDmite. Seg\xFAn datos del OIEA y UNSCEAR, la dosis efectiva media anual de un trabajador de central nuclear en pa\xEDses con buenas pr\xE1cticas radiol\xF3gicas se sit\xFAa entre 1 y 3 mSv/a\xF1o \u2014 comparable o incluso inferior a la de un piloto de largo radio.\n\nEn perspectiva: un piloto de largo radio con programaci\xF3n intensa (80\u2013100 sectores/a\xF1o) puede acumular m\xE1s dosis anual que el trabajador medio de una central nuclear."
    }, {
      icon: "☀️",
      title: "Máximo solar → menos radiación cósmica",
      body: "Esto parece contraintuitivo pero tiene una explicaci\xF3n f\xEDsica precisa.\n\nLos rayos c\xF3smicos de mayor energ\xEDa vienen del espacio interestelar (Rayos C\xF3smicos Gal\xE1cticos, GCR). Para llegar a la Tierra tienen que atravesar el campo magn\xE9tico solar \u2014la heliosfera.\n\nDurante el m\xE1ximo solar, el Sol emite m\xE1s viento solar: un flujo de part\xEDculas y campo magn\xE9tico que infla y refuerza la heliosfera. Ese escudo magn\xE9tico m\xE1s potente deflecta m\xE1s GCR antes de que entren al sistema solar interior.\n\nResultado: en m\xE1ximo solar (como ahora, ciclo 25 ~2024\u20132026) la dosis a bordo es un 10\u201320% menor que en m\xEDnimo solar, especialmente en rutas polares y de alta latitud.\n\nAtenci\xF3n: las erupciones solares (SPE, Solar Particle Events) son la excepci\xF3n \u2014pueden disparar la dosis puntualmente, aunque son raras y breves."
    }, {
      icon: "🤰",
      title: "Tripulantes embarazadas: límites y recomendaciones",
      body: "La ICRP (Publicaci\xF3n 103) establece un l\xEDmite espec\xEDfico para trabajadoras embarazadas expuestas a radiaci\xF3n ionizante: no superar 1 mSv durante todo el embarazo, contado desde la declaraci\xF3n del mismo.\n\nEste l\xEDmite es mucho m\xE1s restrictivo que el general de 20 mSv/a\xF1o para tripulaci\xF3n, y est\xE1 justificado: el embri\xF3n y el feto son especialmente sensibles a la radiaci\xF3n ionizante durante las primeras semanas de desarrollo, cuando se est\xE1n formando los \xF3rganos principales (organog\xE9nesis, semanas 2\u20138).\n\n\xBFQu\xE9 implica en la pr\xE1ctica?\n\nCon una exposici\xF3n t\xEDpica en rutas transatl\xE1nticas de 30\u201360 \xB5Sv por vuelo, un embarazo de 9 meses tiene un presupuesto de radiaci\xF3n de 1.000 \xB5Sv (1 mSv). Eso equivale a unos 15\u201330 vuelos de largo radio durante todo el embarazo, dependiendo de la ruta.\n\nNormativa en Espa\xF1a:\n\nEl Real Decreto 783/2001 y las directrices de la AESA obligan a las aerol\xEDneas a informar a las tripulantes embarazadas de su exposici\xF3n estimada y a reasignarlas a rutas de menor dosis o a tareas en tierra si es necesario para cumplir el l\xEDmite.\n\nRecomendaci\xF3n pr\xE1ctica:\n\nDesde la confirmaci\xF3n del embarazo, lleva un registro mensual de sectores volados y su dosis estimada \u2014exactamente lo que permite hacer esta aplicaci\xF3n\u2014 para comunicarlo al servicio de medicina del trabajo de la compa\xF1\xEDa."
    }, {
      icon: "🚿",
      title: "Mito: ducharse tras volar elimina la radiación",
      body: "Mito muy extendido, sin ninguna base cient\xEDfica.\n\nLa radiaci\xF3n c\xF3smica que recibes a bordo es ionizante penetrante \u2014fotones gamma, muones, neutrones de alta energ\xEDa. Cuando impacta en tus c\xE9lulas, el da\xF1o (si ocurre) ya est\xE1 hecho en el momento de la exposici\xF3n. No deja residuos radiactivos en tu piel, no contamina tu ropa y no se puede \"lavar\".\n\nDucharse elimina contaminaci\xF3n radiactiva superficial \u2014polvo con part\xEDculas radiactivas\u2014 algo relevante en accidentes nucleares o zonas contaminadas, pero completamente irrelevante tras un vuelo comercial."
